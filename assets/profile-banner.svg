  <text x="98" y="254" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.1">LINUX  ·  C  ·  JAVA  ·  SYSTEMS SECURITY</text>
  <rect x="826" y="54" width="312" height="212" rx="18" fill="#0b1220" fill-opacity="0.83" stroke="#64748b" stroke-opacity="0.38"/>
