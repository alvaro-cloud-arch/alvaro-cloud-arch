<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Red Team, offensive security</title>
  <desc id="desc">A dark navy terminal and network-map banner for a computer engineering student focused on Red Team security.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111e"/>
      <stop offset="0.6" stop-color="#111827"/>
      <stop offset="1" stop-color="#171426"/>
    </linearGradient>
